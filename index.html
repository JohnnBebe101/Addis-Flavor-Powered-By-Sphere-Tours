<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Addis Ababa by Locals | City Tours, Day Trips & Local Travel Support</title>
    <meta name="description" content="Explore Addis Ababa with city tours, day trips, practical travel guidance, local guide requests, car hire quotes, and direct support from Sphere Tour & Travel." />
    <link rel="canonical" href="https://addisabababylocals.com" />

    <!-- Favicon.
         The SVG favicon is the only icon the browser needs to draw the tab: the
         18 KB PNG variant was previously fetched on every page load and competed
         with the hero image for bandwidth. The PNG and Apple touch icons are
         still shipped for the web manifest and for iOS home-screen installs. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:title" content="Addis Ababa by Locals | City Tours, Day Trips & Local Travel Support" />
    <meta property="og:description" content="Explore Addis Ababa with city tours, day trips, practical travel guidance, local guide requests, car hire quotes, and direct support from Sphere Tour & Travel." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://addisabababylocals.com" />
    <meta property="og:image" content="https://addisabababylocals.com/images/og/addis-ababa-city-hero-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Addis Ababa cityscape at golden hour" />
    <meta property="og:site_name" content="Addis Ababa by Locals" />
    <meta property="og:locale" content="en" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Addis Ababa by Locals" />
    <meta name="twitter:description" content="Explore Addis Ababa with city tours, day trips, practical travel guidance, and direct support from Sphere Tour & Travel." />
    <meta name="twitter:image" content="https://addisabababylocals.com/images/og/addis-ababa-city-hero-og.jpg" />
    <meta name="twitter:image:alt" content="Addis Ababa cityscape at golden hour" />

    <!-- Fonts: self-hosted woff2 (see @font-face in src/fonts.css). Preload only the
         face that paints the LCP text: DM Sans. Playfair Display (navbar wordmark,
         section headings) is declared but fetched at low priority, so it cannot
         compete with the entry chunk for bandwidth before the hero paints.
         `crossorigin` is mandatory for font preloads even same-origin. -->
    <link
      rel="preload"
      href="/fonts/dm-sans-normal.woff2?v=ddab76df"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/playfair-display-normal.woff2?v=c99c2140"
      as="font"
      type="font/woff2"
      fetchpriority="low"
      crossorigin
    />

    <!-- Hero image preload — the LCP element.
         This full-viewport <img> has meaningful alt text, so Chrome treats it as
         contentful: it IS the LCP candidate, not the paragraph behind it. It was
         previously preloaded at LOW priority on the assumption that Lighthouse
         excludes low-priority images from LCP — that only hides the problem in the
         lab while real-world LCP waits behind the JS chunks and fonts. Preload it
         at high priority so the download starts during HTML parsing, before React
         renders the <picture>. The srcset matches StableHero.heroSrcSet() so the
         preload resolves to the exact same candidate the browser will use. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/images/hero/addis-ababa-city-hero-1920.avif"
      imagesrcset="/images/hero/addis-ababa-city-hero-640.avif 640w, /images/hero/addis-ababa-city-hero-768.avif 768w, /images/hero/addis-ababa-city-hero-1280.avif 1280w, /images/hero/addis-ababa-city-hero-1920.avif 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
