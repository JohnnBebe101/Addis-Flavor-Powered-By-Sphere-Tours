[build]
  command = "npm run build"
  publish = "dist"

# Cache policy.
#
# Rules are matched most-specific first; Netlify merges matching rules and keeps
# the value from the first rule that sets a given header.
#
# /assets/* and /fonts/* carry content hashes (Vite hashes the former, the font
# pipeline appends a ?v=<hash> query to the latter), so they can be cached
# immutably for a year. Everything else is revalidated.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/logo-mark.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Agent-facing files.
#
# The `/*` catch-all below answers any path Netlify does not find on disk with
# app.html, so these three locations have to exist as real files — they do, they
# are generated into public/ by scripts/generate-agent-files.mjs. The headers
# below make the content type explicit and let cross-origin agent tooling read
# the manifest without a CORS preflight.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/ai-catalog.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

# Baseline hardening for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Every other route is client-rendered. It is served the SPA shell (app.html),
# which is the same document as index.html but without the prerendered
# homepage, so a deep link never flashes the homepage before the router takes
# over.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200
